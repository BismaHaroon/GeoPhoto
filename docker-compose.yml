services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: geophoto
      POSTGRES_PASSWORD: geophoto
      POSTGRES_DB: geophoto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
